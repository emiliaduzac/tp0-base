name: tp0
services:
  server:
    container_name: server
    image: server:latest
    entrypoint: python3 /main.py
    environment:
      - PYTHONUNBUFFERED=1
      - CLIENT_AMOUNT=5 
    networks:
      - testing_net
    volumes:
      - ./server/config.ini:/config.ini
  client1:
    container_name: client1
    image: client:latest
    entrypoint: /client
    env_file: ./env_variables/client1.env
    networks:
      - testing_net
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-1.csv:/data/agency-1.csv
    depends_on:
      - server

  client2:
    container_name: client2
    image: client:latest
    entrypoint: /client
    env_file: ./env_variables/client2.env
    networks:
      - testing_net
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-2.csv:/data/agency-2.csv
    depends_on:
      - server

  client3:
    container_name: client3
    image: client:latest
    entrypoint: /client
    env_file: ./env_variables/client3.env
    networks:
      - testing_net
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-3.csv:/data/agency-3.csv
    depends_on:
      - server

  client4:
    container_name: client4
    image: client:latest
    entrypoint: /client
    env_file: ./env_variables/client4.env
    networks:
      - testing_net
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-4.csv:/data/agency-4.csv
    depends_on:
      - server

  client5:
    container_name: client5
    image: client:latest
    entrypoint: /client
    env_file: ./env_variables/client5.env
    networks:
      - testing_net
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-5.csv:/data/agency-5.csv
    depends_on:
      - server

networks:
  testing_net:
    ipam:
      driver: default
      config:
        - subnet: 172.25.125.0/24

